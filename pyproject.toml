[project]
name = "bigbrain"
version = "0.1.0"
description = "Multi-brain AI agent system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["bigbrain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
